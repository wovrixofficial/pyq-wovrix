name: Continuous Cloud Solver (24/7 Auto-Run)

on:
  schedule:
    # Runs automatically every 2 hours in the cloud
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of questions to solve in this run'
        required: false
        default: '250'

permissions:
  contents: write

jobs:
  solve-questions:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cloud Batch Solver
        run: |
          BATCH_SIZE="${{ github.event.inputs.batch_size || '250' }}"
          python scripts/batch_gemini_solver.py "$BATCH_SIZE"

      - name: Commit and Push Verified Solutions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/solutions_cache.json q/
          if git diff --staged --quiet; then
            echo "No new solutions to commit."
          else
            git commit -m "Auto-injected CBSE solutions & schema [skip ci]"
            git push origin main
          fi
