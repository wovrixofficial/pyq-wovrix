<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-W9TG2L83"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learnosha | Student Reports & Error Resolution Console</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/report-modal.css">
  <style>
    .reports-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .reports-header-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .reports-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      background: #eff6ff;
      color: #2563eb;
    }
    .reports-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 24px;
    }
    .reports-table th, .reports-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
    }
    .reports-table th {
      background: #f8fafc;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.05em;
    }
    .issue-tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: #fee2e2;
      color: #991b1b;
      margin-right: 4px;
      margin-bottom: 4px;
    }
    .source-tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .source-cloud {
      background: #dbeafe;
      color: #1e40af;
    }
    .source-local {
      background: #f1f5f9;
      color: #475569;
    }
    .btn-action-primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-action-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
  </style>

  <!-- Open Graph / WhatsApp / Telegram Card -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://learnosha.in/reports/">
  <meta property="og:title" content="Learnosha | Student Reports & Error Resolution Console">
  <meta property="og:description" content="Free chapterwise CBSE Class 12 PCM and NEET UG question archive with step solutions and recurrence data.">
  <meta property="og:image" content="https://learnosha.in/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="Learnosha">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://learnosha.in/reports/">
  <meta name="twitter:title" content="Learnosha | Student Reports & Error Resolution Console">
  <meta name="twitter:description" content="Free chapterwise CBSE Class 12 PCM and NEET UG question archive with step solutions and recurrence data.">
  <meta name="twitter:image" content="https://learnosha.in/og-image.png">
</head>
<body>
  <div class="reports-container">
    <div class="reports-header-card">
      <div>
        <div class="reports-badge">Central Diagnostic Console</div>
        <h1 style="font-size: 24px; margin: 8px 0 4px 0;">Student Reports & Error Resolution</h1>
        <p style="color: var(--text-muted); font-size: 13px; margin: 0;">
          Synchronized across all user devices via GitHub repo queue. Run <code style="font-family: var(--font-mono); font-size: 12px;">python scripts/morning_autofix.py</code> to auto-resolve.
        </p>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="btn-action-primary" onclick="exportReportsQueue()">
          <span>📥 Download reports_queue.json</span>
        </button>
        <button class="btn-action-secondary" onclick="loadReports(true)">
          <span>🔄 Refresh Live Queue</span>
        </button>
        <button class="btn-action-secondary" onclick="copyQueueJson()">
          <span>📋 Copy Queue JSON</span>
        </button>
        <button class="btn-action-secondary" onclick="clearReportsQueue()" style="color: #ef4444;">
          <span>Clear Local Queue</span>
        </button>
      </div>
    </div>

    <div id="reportsListContainer">
      <div class="loading-state">Fetching reports from central queue & local cache...</div>
    </div>
  </div>

  <script>
    let allReports = [];

    async function loadReports(forceRefresh = false) {
      const container = document.getElementById('reportsListContainer');
      container.innerHTML = '<div class="loading-state">Fetching reports from central queue & local cache...</div>';

      let localReports = [];
      try {
        localReports = JSON.parse(localStorage.getItem('wovrix_pyq_reports') || '[]');
        localReports.forEach(r => r._source = 'Local Browser');
      } catch (e) {
        localReports = [];
      }

      let cloudReports = [];
      try {
        const res = await fetch('/api/report');
        if (res.ok) {
          const d = await res.json();
          cloudReports = d.reports || [];
          cloudReports.forEach(r => r._source = 'Central Queue');
        }
      } catch (_) {}

      // Deduplicate by qid + timestamp
      const seen = new Set();
      allReports = [];

      [...cloudReports, ...localReports].forEach(r => {
        const key = `${r.qid}_${r.timestamp || r.notes || ''}`;
        if (!seen.has(key)) {
          seen.add(key);
          allReports.push(r);
        }
      });

      if (allReports.length === 0) {
        container.innerHTML = `
          <div style="background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius-md); padding: 48px 24px; text-align: center;">
            <div style="font-size: 32px; margin-bottom: 12px;">✅</div>
            <h3 style="margin: 0 0 6px 0;">No Pending Reports</h3>
            <p style="color: var(--text-muted); font-size: 13px; margin: 0 0 16px 0;">
              Zero error reports currently pending in the central queue or your browser. Questions reported via the 🚩 button on any device will appear here automatically.
            </p>
            <a href="/practice/" class="btn-action-primary" style="text-decoration: none;">Go to Practice Hub</a>
          </div>
        `;
        return;
      }

      let rowsHtml = '';
      allReports.forEach((r, idx) => {
        const issuesBadges = (r.issues || []).map(i => `<span class="issue-tag">${i.replace('_', ' ')}</span>`).join('');
        const sourceBadge = r._source === 'Central Queue' 
          ? `<span class="source-tag source-cloud">Central (GitHub #${r.issueNumber || ''})</span>` 
          : `<span class="source-tag source-local">Browser Local</span>`;

        rowsHtml += `
          <tr>
            <td><strong>#${r.qid || 'N/A'}</strong></td>
            <td>${r.subject || 'General'}</td>
            <td>${r.year || 'PYQ'}</td>
            <td>${r.chapter || '—'}</td>
            <td>${issuesBadges || 'General Issue'}</td>
            <td>${r.notes ? `<em>${r.notes}</em>` : '<span style="color: var(--text-muted);">None</span>'}</td>
            <td>${sourceBadge}</td>
            <td style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">${r.timestamp ? new Date(r.timestamp).toLocaleTimeString() : 'Recent'}</td>
          </tr>
        `;
      });

      container.innerHTML = `
        <table class="reports-table">
          <thead>
            <tr>
              <th>QID</th>
              <th>Subject</th>
              <th>Year</th>
              <th>Chapter</th>
              <th>Issues Reported</th>
              <th>Student Notes</th>
              <th>Origin</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>
      `;
    }

    function exportReportsQueue() {
      if (allReports.length === 0) {
        alert('Queue is empty! Report a question first using the 🚩 button on any question card.');
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allReports, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "reports_queue.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      alert('Downloaded reports_queue.json! Saved into your downloads.');
    }

    function copyQueueJson() {
      navigator.clipboard.writeText(JSON.stringify(allReports, null, 2)).then(() => {
        alert(`Copied ${allReports.length} report(s) to clipboard in JSON format!`);
      });
    }

    function clearReportsQueue() {
      if (confirm('Clear all queued reports from local storage?')) {
        localStorage.removeItem('wovrix_pyq_reports');
        loadReports();
      }
    }

    loadReports();
  </script>
</body>
</html>
